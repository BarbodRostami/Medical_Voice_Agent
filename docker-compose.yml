version: '3.8'

services:

  # ─── Backend (FastAPI + RAG) ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      # ── Ollama host configuration ──────────────────────────────────────────
      # Docker Desktop (Windows/Mac): use host.docker.internal
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Linux server (e.g. Ubuntu VM): replace with Docker gateway IP instead:
      # - OLLAMA_HOST=http://172.17.0.1:11434
      # ────────────────────────────────────────────────────────────────────────
      - OLLAMA_LOAD_TIMEOUT=30m
      - OLLAMA_KEEP_ALIVE=60m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medical_rag_network
    restart: unless-stopped

  # ─── Frontend (Streamlit UI) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000/chat
      - BACKEND_STREAM_URL=http://backend:8000/chat/stream
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Admin Panel (Django) ─────────────────────────────────────────────────────
  django-admin:
    build:
      context: .
      dockerfile: admin_panel/Dockerfile.django
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  medical_rag_network:
    driver: bridge

volumes:
  huggingface_cache:

