version: '3.8'

services:
  # سرویس بک‌ند (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medical_rag_network
    restart: always

  # سرویس رابط کاربری (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/chat
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: always

  # سرویس پنل ادمین (Django)
  django-admin:
    build:
      context: .
      dockerfile: admin_panel/Dockerfile.django
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: always

networks:
  medical_rag_network:
    driver: bridge
