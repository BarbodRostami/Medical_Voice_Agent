version: '3.8'

services:

  # ─── Ollama (Local LLM Server) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - medical_rag_network
    restart: unless-stopped
    # Pull the medical model on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull biomistral && wait"]

  # ─── Backend (FastAPI + RAG) ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - medical_rag_network
    depends_on:
      - ollama
    restart: unless-stopped

  # ─── Frontend (Streamlit UI) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Admin Panel (Django) ─────────────────────────────────────────────────────
  django-admin:
    build:
      context: .
      dockerfile: admin_panel/Dockerfile.django
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - medical_rag_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  medical_rag_network:
    driver: bridge

volumes:
  ollama_data:
