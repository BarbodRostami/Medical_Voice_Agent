name: CI / Deploy

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t medical-voice-agent:ci .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install --quiet fastapi httpx python-dotenv pytest

      - name: Syntax check (backend)
        run: python -m py_compile backend/main_api.py backend/api_auth.py

      - name: Run unit tests
        run: python -m pytest tests/test_api_auth.py -v

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_PAT
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}

            echo "==> Pulling latest main branch..."
            git fetch https://$GH_PAT@github.com/behinmed/medical-voice-agent.git main
            git stash || true
            git checkout main
            git reset --hard FETCH_HEAD

            echo "==> Rebuilding and restarting backend container..."
            docker build --network host -t medical_voice_agent_backend:latest .
            docker compose up -d --no-build backend

            echo "==> Deploy complete!"
            docker compose ps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
